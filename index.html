<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d11">
<title>Phastos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">✳</span><span><b>PHASTOS</b><small>ESTADO <b id="estadoLbl">en reposo</b></small></span></div>
  <div class="top-actions">
    <button class="icon-btn" id="btnLimpiar" title="Nueva conversación" aria-label="Nueva conversación">⟲</button>
    <button class="icon-btn" id="btnAjustes" title="Ajustes" aria-label="Ajustes">⚙</button>
  </div>
</header>

<section class="scene" id="scene" data-anim="orbital" data-estado="reposo">
  <div class="ring r1"></div><div class="ring r2"></div><div class="ambient"></div>
  <button class="core" id="orb" aria-label="Hablar con Phastos">
    <div class="orb"><div class="atomring"><i></i></div><div class="atomring rB"><i></i></div><div class="atomring rC"><i></i></div><div class="orbitCore"></div></div>
    <div class="sig"><div class="wavefield"><i></i><i></i><i></i><i></i><i></i></div><div class="wavebeam" id="wavebeam"></div><div class="pulseCore"></div></div>
  </button>
  <div class="greeting">
    <div class="overline">✳　Phastos está contigo</div>
    <p class="heard" id="estadoTxt" aria-live="polite">Toca el núcleo para hablar</p>
  </div>
</section>

<main id="chat" aria-live="polite"></main>

<form class="entrada" id="formTexto">
  <input id="texto" type="text" placeholder="O escríbele…" autocomplete="off" enterkeyhint="send">
  <button type="submit" aria-label="Enviar">➤</button>
</form>

<dialog id="ajustes">
  <form method="dialog" class="ajustes-form">
    <h2>Ajustes</h2>
    <label>API key de Claude
      <input id="cfgKey" type="password" placeholder="sk-ant-..." autocomplete="off">
      <small>Se guarda solo en este celular.</small>
    </label>
    <label>Modelo
      <select id="cfgModelo">
        <option value="claude-haiku-5-5">Haiku 5.5 — rápido y barato (recomendado)</option>
        <option value="claude-sonnet-5-5">Sonnet 5.5 — más capaz</option>
        <option value="claude-opus-5-5">Opus 5.5 — el más potente (más lento/costoso)</option>
      </select>
    </label>
    <label>Tu nombre <input id="cfgNombre" type="text" placeholder="Cesar"></label>
    <label>Ciudad (para búsquedas y clima) <input id="cfgCiudad" type="text" placeholder="Ibagué"></label>
    <h3>Voz</h3>
    <label>Motor de voz
      <select id="cfgMotor">
        <option value="navegador">Voz del teléfono (gratis, sin clave)</option>
        <option value="azure">Microsoft Azure — voces neuronales como en Edge</option>
        <option value="eleven">ElevenLabs — voz propia</option>
      </select>
    </label>
    <div data-motor="navegador"><label>Voz del teléfono <select id="cfgVoz"></select></label></div>
    <div data-motor="azure" class="bloque">
      <label>Clave de Azure Speech <input id="cfgAzKey" type="password" autocomplete="off" placeholder="KEY 1 del recurso Speech"></label>
      <label>Región del recurso <input id="cfgAzRegion" type="text" autocomplete="off" placeholder="eastus"></label>
      <button type="button" id="btnVocesAz" class="mini">⟳ Cargar voces de Azure</button>
      <label>Voz de Azure <select id="cfgAzVoz"></select></label>
      <small>Plan gratis (F0): 500.000 caracteres al mes. Si Azure falla, Phastos usa la voz del teléfono.</small>
    </div>
    <div data-motor="eleven" class="bloque">
      <label>API key de ElevenLabs <input id="cfgElKey" type="password" autocomplete="off"></label>
      <label>Voice ID <input id="cfgElVoz" type="text" autocomplete="off"></label>
    </div>
    <button type="button" id="btnProbarVoz" class="mini">▶ Probar voz</button>
    <label>Velocidad de voz <input id="cfgVel" type="range" min="0.7" max="1.5" step="0.05"></label>
    <label class="check"><input id="cfgWake" type="checkbox"> Escuchar «Oye Phastos» con la app abierta</label>
    <label class="check"><input id="cfgBuscar" type="checkbox"> Permitir búsquedas en internet</label>

    <h3>Contactos rápidos</h3>
    <div id="listaContactos" class="contactos"></div>
    <div class="fila">
      <button type="button" id="btnImportar">Importar del teléfono</button>
      <button type="button" id="btnAgregar">Agregar manual</button>
    </div>

    <h3>Lo que Phastos recuerda</h3>
    <div id="listaNotas" class="contactos"></div>

    <div class="fila final">
      <button type="button" id="btnNotif">Activar notificaciones</button>
      <button value="ok" id="btnGuardar" class="primario">Guardar</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
